<rect x="345" y="365" width="180" height="90" rx="45" fill="#ffe1e4"/><text x="435" y="419" fill="#9f2635" font-size="18" font-weight="800">BLOCKED · 4</text>
<rect x="620" y="365" width="180" height="90" rx="45" fill="#ffe1e4"/><text x="710" y="419" fill="#9f2635" font-size="18" font-weight="800">REJECTED · 1</text>
<rect x="895" y="365" width="210" height="90" rx="45" fill="#fff0d4"/><text x="1000" y="419" fill="#8b5400" font-size="18" font-weight="800">EXPIRED · 1</text>
